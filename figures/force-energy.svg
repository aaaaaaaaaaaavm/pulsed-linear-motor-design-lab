  <g id="text_25">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(10.224 310.965)">Computed energy accounting: the same two local cases; plmd.calculate.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(10.224 322.922656)">Moving kinetic energy includes carriage. Input minus kinetic energy is not a loss allocation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(10.224 334.880312)">Positive ideal energy margin does not close an electrical or thermal design. 23 Oct 2026.</text>
