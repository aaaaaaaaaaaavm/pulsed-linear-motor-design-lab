[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsed-linear-motor-design-lab"
version = "0.1.1"
description = "Screening calculations and a traceable VOLLEY reference case for pulsed linear motors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adityavardhan Mishra"}]
dependencies = []

[project.optional-dependencies]
dev = []
reference = ["numpy>=2,<3", "matplotlib>=3.8", "magpylib>=5,<6"]
fem = ["numpy==2.3.5", "gmsh==4.15.2", "scikit-fem==12.0.2"]

[project.scripts]
plmd = "plmd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
